<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Github Task</h1>
         <div class="explanation">
        <p><strong>Learning Goal:</strong> Understanding the basics of Git and GitHub for version control and collaboration.</p>
    </div>
    </header>

    <section>
        <h2>Product Dashboard</h2>
        <div class="buttons">
            <a href="https://github.com/DevAkiti/Frontend-version-control-task-Francis-Akiti" target="_blank"><button id="show-all">GitHub Repository</button></a>
            <button id="show-all">Show All Items (.map)</button>
            <button id="show-tech">Tech Only (.filter + .map)</button>
            <button id="total">Total Value (.reduce)</button>
            <button id="log-names" class="info">Alert Product (.forEach)</button>
            <button id="remove-first" class="delete">Remove First Item (.splice)</button>
        </div>

        <div id="product-container" class="product-grid"></div>
        <div id="total-price"></div>
    </section>
</body>
</html>
